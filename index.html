<!-- HAPPYCAT_SANDBOX_STORAGE_V1: Game scores only, not auth or private data. -->
<script>
(function () {
  'use strict';
  const kind = 'session';
  const key = kind + 'Storage';
  let seeded = {};
  try {
    const blob = new URLSearchParams(location.hash.slice(1)).get('happycat_scores');
    if (blob && blob.length < 4096) {
      const parsed = JSON.parse(atob(blob));
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) seeded = parsed;
    }
  } catch (error) { /* Normal play works even without score restore. */ }
  window.happycatSandboxStorage = {
    getItem(name) {
      const k = String(name);
      try { return window[key].getItem(k); }
      catch (error) { return Object.prototype.hasOwnProperty.call(seeded, k) ? String(seeded[k]) : null; }
    },
    setItem(name, value) {
      const k = String(name), v = String(value);
      try { window[key].setItem(k, v); }
      catch (error) {
        seeded[k] = v;
        if (window.parent !== window) window.parent.postMessage({ type: 'happycat-score-v1', key: k, value: v }, '*');
      }
    }
  };
})();
</script>

    <script>
        // 完整的 Web Audio 8-bit 合成音效引擎
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                try {
                    if (!this.ctx) {
                        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                        if (AudioContextClass) {
                            this.ctx = new AudioContextClass();
                        }
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (e) {
                    console.warn('Audio Context initialization error:', e);
                }
            }

            playHop() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(620, now + 0.07);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.07);
                } catch (e) {}
            }

            playPlunk() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.18);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } catch (e) {}
            }

            playSquash() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.22);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.22);
                } catch (e) {}
            }

            playHome() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [440, 554, 659];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                        gain.gain.setValueAtTime(0.1, now + idx * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.1);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.06);
                        osc.stop(now + idx * 0.06 + 0.1);
                    });
                } catch (e) {}
            }

            playBonus() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [523, 659, 783, 1046];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                        gain.gain.setValueAtTime(0.12, now + idx * 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.08);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.05);
                        osc.stop(now + idx * 0.05 + 0.08);
                    });
                } catch (e) {}
            }

            playLevelClear() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const melody = [523, 659, 783, 1046, 783, 1046];
                    melody.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.14, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.12);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.12);
                    });
                } catch (e) {}
            }

            playGameOver() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const notes = [330, 311, 293, 277];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.14);
                        gain.gain.setValueAtTime(0.15, now + idx * 0.14);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.16);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.14);
                        osc.stop(now + idx * 0.14 + 0.16);
                    });
                } catch (e) {}
            }
        }

        const sound = new SoundEngine();

        // 經典街機規格配置：14 列 (columns) x 15 行 (rows)
        const COLS = 14;
        const ROWS = 15;
        const INTERNAL_WIDTH = 560; // 內部渲染基準寬度
        const INTERNAL_HEIGHT = 600; // 內部渲染基準高度
        const CELL_SIZE = INTERNAL_WIDTH / COLS; // 40px

        // 原版經典 5 個終點山洞槽位
        const HOME_SLOTS = [
            { col: 1.0, filled: false, hasFly: false },
            { col: 3.8, filled: false, hasFly: false },
            { col: 6.7, filled: false, hasFly: false },
            { col: 9.5, filled: false, hasFly: false },
            { col: 12.3, filled: false, hasFly: false }
        ];

        class Frog {
            constructor() {
                this.reset();
            }

            reset() {
                this.col = 6.5; // 水平置中
                this.row = 13;   // 起始草地
                this.x = this.col * CELL_SIZE;
                this.y = this.row * CELL_SIZE;
                this.targetX = this.x;
                this.targetY = this.y;
                this.dir = 'UP';
                this.isJumping = false;
                this.jumpProgress = 0;
                this.isDead = false;
                this.deathType = null;
                this.deathTimer = 0;
            }

            move(dCol, dRow, newDir) {
                if (this.isDead || game.state !== 'PLAYING') return;

                const nextCol = this.col + dCol;
                const nextRow = this.row + dRow;

                // 邊界防護
                if (nextCol < 0 || nextCol >= COLS) return;
                if (nextRow > 13) return;
                if (nextRow < 1) return;

                this.dir = newDir;
                this.col = nextCol;
                this.row = nextRow;
                this.targetX = this.col * CELL_SIZE;
                this.targetY = this.row * CELL_SIZE;
                this.isJumping = true;
                this.jumpProgress = 0;

                sound.playHop();

                // 向上跳一步得 10 分
                if (dRow < 0) {
                    game.addScore(10);
                }
            }

            update(deltaTime) {
                if (this.isDead) {
                    this.deathTimer += deltaTime;
                    return;
                }

                if (this.isJumping) {
                    this.jumpProgress += deltaTime * 12;
                    if (this.jumpProgress >= 1) {
                        this.jumpProgress = 1;
                        this.isJumping = false;
                        this.x = this.targetX;
                        this.y = this.targetY;
                    } else {
                        this.x += (this.targetX - this.x) * 0.45;
                        this.y += (this.targetY - this.y) * 0.45;
                    }
                } else {
                    this.x = this.targetX;
                    this.y = this.targetY;
                }
            }

            die(type) {
                if (this.isDead) return;
                this.isDead = true;
                this.deathType = type;
                this.deathTimer = 0;
                if (type === 'squash') {
                    sound.playSquash();
                } else {
                    sound.playPlunk();
                }
                game.onFrogDeath();
            }
        }

        class Obstacle {
            constructor(row, x, width, speed, type, extra = {}) {
                this.row = row;
                this.x = x;
                this.y = row * CELL_SIZE;
                this.width = width;
                this.height = CELL_SIZE - 4;
                this.speed = speed;
                this.type = type;
                this.extra = extra;
                this.submerged = false; // 保持浮起，不下沉致死
            }

            update(deltaTime, levelSpeedMultiplier) {
                this.x += this.speed * levelSpeedMultiplier * deltaTime;

                if (this.speed > 0 && this.x > INTERNAL_WIDTH + 80) {
                    this.x = -this.width - 20;
                } else if (this.speed < 0 && this.x < -this.width - 80) {
                    this.x = INTERNAL_WIDTH + 20;
                }

                this.submerged = false;
            }
        }

        class LaneManager {
            constructor() {
                this.lanes = [];
                this.initLanes();
            }

            initLanes() {
                this.lanes = [];

                // === 河流區 (Row 2 - 6) ===
                // Row 2: 巨型浮木
                this.createLane(2, 60, 160, 3, 'log', { color: '#8b4513' });
                // Row 3: 三隻一組海龜群 (穩定浮力)
                this.createTurtleLane(3, -75, 3, 4);
                // Row 4: 極長巨木
                this.createLane(4, 110, 210, 2, 'log', { color: '#654321' });
                // Row 5: 小型浮木
                this.createLane(5, 50, 95, 3, 'log', { color: '#8b4513' });
                // Row 6: 雙隻一組海龜群 (穩定浮力)
                this.createTurtleLane(6, -85, 2, 4);

                // === 公路區 (Row 8 - 12) ===
                // Row 8: 紅色超跑
                this.createRoadLane(8, -130, 50, 3, 'racer', '#ef4444');
                // Row 9: 重型泥頭卡車
                this.createRoadLane(9, 70, 85, 2, 'truck', '#f59e0b');
                // Row 10: 紫色街車
                this.createRoadLane(10, -90, 48, 3, 'car2', '#a855f7');
                // Row 11: 拖車推土機
                this.createRoadLane(11, 55, 60, 3, 'tractor', '#eab308');
                // Row 12: 計程車藍車
                this.createRoadLane(12, -80, 46, 3, 'car1', '#3b82f6');
            }

            createLane(row, speed, width, count, type, extra = {}) {
                const spacing = INTERNAL_WIDTH / count;
                for (let i = 0; i < count; i++) {
                    const x = i * spacing + (Math.random() * 20);
                    this.lanes.push(new Obstacle(row, x, width, speed, type, extra));
                }
            }

            createTurtleLane(row, speed, turtleCountPerGroup, groupCount) {
                const groupWidth = turtleCountPerGroup * 36;
                const spacing = (INTERNAL_WIDTH + 100) / groupCount;
                for (let i = 0; i < groupCount; i++) {
                    const x = i * spacing;
                    this.lanes.push(new Obstacle(row, x, groupWidth, speed, 'turtle', {
                        turtlesInGroup: turtleCountPerGroup
                    }));
                }
            }

            createRoadLane(row, speed, width, count, type, color) {
                const spacing = (INTERNAL_WIDTH + 60) / count;
                for (let i = 0; i < count; i++) {
                    const x = i * spacing + (i * 25);
                    this.lanes.push(new Obstacle(row, x, width, speed, type, { color: color }));
                }
            }

            update(deltaTime, levelMultiplier) {
                this.lanes.forEach(obs => obs.update(deltaTime, levelMultiplier));
            }
        }

        class Renderer {
            constructor(ctx) {
                this.ctx = ctx;
            }

            drawBackground() {
                const ctx = this.ctx;

                // 頂部背景
                ctx.fillStyle = '#0a0f1d';
                ctx.fillRect(0, 0, INTERNAL_WIDTH, CELL_SIZE * 2);

                // 河流背景 (Row 2 - 6)
                ctx.fillStyle = '#1e3a8a';
                ctx.fillRect(0, CELL_SIZE * 2, INTERNAL_WIDTH, CELL_SIZE * 5);

                // 微弱水波
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 1.5;
                const time = Date.now() * 0.003;
                for (let r = 2; r < 7; r++) {
                    const offset = (Math.sin(time + r) * 10);
                    ctx.beginPath();
                    ctx.moveTo(offset, r * CELL_SIZE + CELL_SIZE * 0.5);
                    ctx.lineTo(INTERNAL_WIDTH + offset, r * CELL_SIZE + CELL_SIZE * 0.5);
                    ctx.setLineDash([12, 24]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // 中間安全分隔草地 (Row 7)
                ctx.fillStyle = '#14532d';
                ctx.fillRect(0, CELL_SIZE * 7, INTERNAL_WIDTH, CELL_SIZE);
                ctx.fillStyle = '#16a34a';
                for (let x = 0; x < INTERNAL_WIDTH; x += 16) {
                    ctx.fillRect(x + 2, CELL_SIZE * 7 + 4, 3, 10);
                    ctx.fillRect(x + 8, CELL_SIZE * 7 + 14, 3, 8);
                }

                // 公路道路 (Row 8 - 12)
                ctx.fillStyle = '#111827';
                ctx.fillRect(0, CELL_SIZE * 8, INTERNAL_WIDTH, CELL_SIZE * 5);

                // 車道白色虛線
                ctx.strokeStyle = '#9ca3af';
                ctx.lineWidth = 2;
                ctx.setLineDash([14, 16]);
                for (let r = 9; r < 13; r++) {
                    ctx.beginPath();
                    ctx.moveTo(0, r * CELL_SIZE);
                    ctx.lineTo(INTERNAL_WIDTH, r * CELL_SIZE);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                // 起始草地 (Row 13)
                ctx.fillStyle = '#14532d';
                ctx.fillRect(0, CELL_SIZE * 13, INTERNAL_WIDTH, CELL_SIZE);
                ctx.fillStyle = '#16a34a';
                for (let x = 0; x < INTERNAL_WIDTH; x += 16) {
                    ctx.fillRect(x + 3, CELL_SIZE * 13 + 6, 3, 10);
                    ctx.fillRect(x + 10, CELL_SIZE * 13 + 12, 3, 8);
                }

                // 頂部經典 5 個原版半橢圓拱門山洞
                this.drawHomeBays();
            }

            drawHomeBays() {
                const ctx = this.ctx;
                // 草綠色岸壁底色
                ctx.fillStyle = '#15803d';
                ctx.fillRect(0, CELL_SIZE * 1, INTERNAL_WIDTH, CELL_SIZE);

                // 草叢紋理點綴
                ctx.fillStyle = '#16a34a';
                for (let x = 0; x < INTERNAL_WIDTH; x += 14) {
                    ctx.fillRect(x + 2, CELL_SIZE * 1 + 2, 3, 6);
                }

                // 5 個經典半橢圓拱門山洞
                HOME_SLOTS.forEach((slot) => {
                    const slotX = slot.col * CELL_SIZE;
                    const slotW = CELL_SIZE * 1.25;
                    const centerX = slotX + slotW / 2;
                    const bottomY = CELL_SIZE * 2;
                    const rx = slotW / 2;
                    const ry = CELL_SIZE * 0.95;

                    // 繪製半橢圓拱門洞口 (深藍黑洞口)
                    ctx.save();
                    ctx.beginPath();
                    // 底部左側 -> 上方半橢圓弧 -> 底部右側閉合
                    ctx.ellipse(centerX, bottomY, rx, ry, 0, Math.PI, 0, false);
                    ctx.lineTo(centerX + rx, bottomY);
                    ctx.lineTo(centerX - rx, bottomY);
                    ctx.closePath();

                    ctx.fillStyle = '#061325';
                    ctx.fill();

                    // 山洞邊框 (深綠草叢輪廓線)
                    ctx.strokeStyle = '#052e16';
                    ctx.lineWidth = 3.5;
                    ctx.stroke();

                    // 山洞上方岩石/草蔭陰影弧形
                    ctx.strokeStyle = '#041d0e';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(centerX, bottomY, rx - 3, ry - 3, 0, Math.PI, 0, false);
                    ctx.stroke();

                    ctx.restore();

                    const frogCenterY = CELL_SIZE * 1.5;

                    if (slot.filled) {
                        this.drawMiniFrog(centerX, frogCenterY);
                    } else if (slot.hasFly) {
                        this.drawFly(centerX, frogCenterY);
                    }
                });
            }

            drawFly(x, y) {
                const ctx = this.ctx;
                ctx.save();
                ctx.translate(x, y);
                const wingFlap = Math.sin(Date.now() * 0.03) * 3;
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.ellipse(-4, -4 + wingFlap, 5, 2, -Math.PI / 4, 0, Math.PI * 2);
                ctx.ellipse(4, -4 + wingFlap, 5, 2, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#eab308';
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawMiniFrog(x, y) {
                const ctx = this.ctx;
                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-5, -5, 3, 0, Math.PI * 2);
                ctx.arc(5, -5, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(-5, -5, 1.5, 0, Math.PI * 2);
                ctx.arc(5, -5, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawObstacles(obstacles) {
                const ctx = this.ctx;

                obstacles.forEach(obs => {
                    const y = obs.y + 2;

                    if (obs.type === 'log') {
                        // 浮木木紋
                        ctx.fillStyle = obs.extra.color || '#8b4513';
                        ctx.beginPath();
                        ctx.roundRect(obs.x, y, obs.width, obs.height, 8);
                        ctx.fill();
                        ctx.strokeStyle = '#5c2c16';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.fillStyle = '#a25e2e';
                        ctx.fillRect(obs.x + 8, y + 4, obs.width - 16, 4);
                        ctx.fillRect(obs.x + 12, y + obs.height - 8, obs.width - 24, 3);
                    } else if (obs.type === 'turtle') {
                        // 原版海龜圖示（明亮清新、高辨識度）
                        const count = obs.extra.turtlesInGroup || 2;
                        for (let i = 0; i < count; i++) {
                            const tx = obs.x + i * 36;
                            const cx = tx + 18;
                            const cy = y + obs.height / 2;

                            // 水花微光
                            ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
                            ctx.beginPath();
                            ctx.ellipse(cx, cy, 18, 15, 0, 0, Math.PI * 2);
                            ctx.fill();

                            // 海龜甲殼主體
                            ctx.fillStyle = '#10b981';
                            ctx.beginPath();
                            ctx.ellipse(cx, cy, 15, 12, 0, 0, Math.PI * 2);
                            ctx.fill();

                            ctx.strokeStyle = '#047857';
                            ctx.lineWidth = 2;
                            ctx.stroke();

                            // 龜甲亮綠斑紋
                            ctx.fillStyle = '#34d399';
                            ctx.beginPath();
                            ctx.ellipse(cx, cy, 9, 7, 0, 0, Math.PI * 2);
                            ctx.fill();

                            // 龜甲十字高光
                            ctx.strokeStyle = '#a7f3d0';
                            ctx.lineWidth = 1.5;
                            ctx.beginPath();
                            ctx.moveTo(cx - 9, cy);
                            ctx.lineTo(cx + 9, cy);
                            ctx.moveTo(cx, cy - 7);
                            ctx.lineTo(cx, cy + 7);
                            ctx.stroke();

                            // 鰭肢
                            ctx.fillStyle = '#059669';
                            ctx.beginPath();
                            ctx.ellipse(cx - 11, cy - 8, 4, 3, -0.4, 0, Math.PI * 2);
                            ctx.ellipse(cx + 11, cy - 8, 4, 3, 0.4, 0, Math.PI * 2);
                            ctx.ellipse(cx - 10, cy + 8, 3, 3, 0.4, 0, Math.PI * 2);
                            ctx.ellipse(cx + 10, cy + 8, 3, 3, -0.4, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else {
                        // 車輛繪製
                        this.drawVehicle(obs);
                    }
                });
            }

            drawVehicle(obs) {
                const ctx = this.ctx;
                const x = obs.x;
                const y = obs.y + 3;
                const w = obs.width;
                const h = obs.height - 2;
                const color = obs.extra.color || '#3b82f6';
                const isHeadingRight = obs.speed > 0;

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 5);
                ctx.fill();
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#0f172a';
                const cabinW = w * 0.45;
                const cabinX = isHeadingRight ? x + w * 0.25 : x + w * 0.3;
                ctx.fillRect(cabinX, y + 3, cabinW, h - 6);

                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(cabinX + 2, y + 5, cabinW - 4, 3);

                if (isHeadingRight) {
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(x + w - 3, y + 2, 3, 4);
                    ctx.fillRect(x + w - 3, y + h - 6, 3, 4);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(x, y + 2, 2, 4);
                    ctx.fillRect(x, y + h - 6, 2, 4);
                } else {
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(x, y + 2, 3, 4);
                    ctx.fillRect(x, y + h - 6, 3, 4);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(x + w - 2, y + 2, 2, 4);
                    ctx.fillRect(x + w - 2, y + h - 6, 2, 4);
                }
            }

            drawFrog(frog) {
                const ctx = this.ctx;
                const cx = frog.x + CELL_SIZE / 2;
                const cy = frog.y + CELL_SIZE / 2;

                ctx.save();
                ctx.translate(cx, cy);

                if (frog.isDead) {
                    if (frog.deathType === 'squash') {
                        ctx.fillStyle = '#ef4444';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 16, 8, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '10px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('✕', 0, 0);
                    } else {
                        const r = Math.min(22, (frog.deathTimer * 30));
                        ctx.strokeStyle = '#60a5fa';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.arc(0, 0, r, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.fillStyle = '#93c5fd';
                        ctx.beginPath();
                        ctx.arc(0, 0, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                    return;
                }

                let scaleX = 1;
                let scaleY = 1;
                if (frog.isJumping) {
                    const jumpPhase = Math.sin(frog.jumpProgress * Math.PI);
                    scaleY = 1 + jumpPhase * 0.35;
                    scaleX = 1 - jumpPhase * 0.2;
                }

                if (frog.dir === 'DOWN') ctx.rotate(Math.PI);
                else if (frog.dir === 'LEFT') ctx.rotate(-Math.PI / 2);
                else if (frog.dir === 'RIGHT') ctx.rotate(Math.PI / 2);

                ctx.scale(scaleX, scaleY);

                // 青蛙本體
                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.ellipse(0, 2, 12, 14, 0, 0, Math.PI * 2);
                ctx.fill();

                // 腹部淡黃斑紋
                ctx.fillStyle = '#bbf7d0';
                ctx.beginPath();
                ctx.ellipse(0, 3, 6, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                // 四肢
                ctx.fillStyle = '#16a34a';
                const legSpread = frog.isJumping ? 16 : 11;
                ctx.beginPath();
                ctx.ellipse(-legSpread, 8, 4, 8, -Math.PI / 4, 0, Math.PI * 2);
                ctx.ellipse(legSpread, 8, 4, 8, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(-10, -8, 3, 5, Math.PI / 6, 0, Math.PI * 2);
                ctx.ellipse(10, -8, 3, 5, -Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();

                // 眼睛
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-7, -10, 4.5, 0, Math.PI * 2);
                ctx.arc(7, -10, 4.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(-7, -11, 2, 0, Math.PI * 2);
                ctx.arc(7, -11, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.renderer = new Renderer(this.ctx);
                this.frog = new Frog();
                this.laneManager = new LaneManager();

                this.score = 0;
                this.highScore = 0;
                try {
                    this.highScore = parseInt(window.happycatSandboxStorage.getItem('frogger_high_score') || '0', 10);
                } catch(e) {}

                this.level = 1;
                this.lives = 3;
                this.timeLimit = 35;
                this.timer = this.timeLimit;
                this.state = 'START';
                this.lastFrameTime = performance.now();

                this.bonusFlyTimer = 0;

                this.initCanvasSize();
                window.addEventListener('resize', () => this.initCanvasSize());
            }

            initCanvasSize() {
                this.canvas.width = INTERNAL_WIDTH;
                this.canvas.height = INTERNAL_HEIGHT;
            }

            startNewGame() {
                sound.init();
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.resetHomeSlots();
                this.laneManager.initLanes();
                this.resetRound();
                this.state = 'PLAYING';
                this.updateUI();

                const overlay = document.getElementById('overlayScreen');
                if (overlay) overlay.classList.add('hidden');
            }

            resetRound() {
                this.timer = this.timeLimit;
                this.frog.reset();
                this.laneManager.update(0.01, 1);
            }

            resetHomeSlots() {
                HOME_SLOTS.forEach(slot => {
                    slot.filled = false;
                    slot.hasFly = false;
                });
            }

            addScore(pts) {
                this.score += pts;
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    try {
                        window.happycatSandboxStorage.setItem('frogger_high_score', this.highScore);
                    } catch(e) {}
                }
                this.updateUI();
            }

            onFrogDeath() {
                setTimeout(() => {
                    this.lives--;
                    this.updateUI();

                    if (this.lives <= 0) {
                        this.state = 'GAMEOVER';
                        sound.playGameOver();
                        this.showGameOverScreen();
                    } else {
                        this.resetRound();
                    }
                }, 850);
            }

            checkCollisions(deltaTime) {
                const frog = this.frog;
                if (frog.isDead || this.state !== 'PLAYING') return;

                if (frog.isJumping && frog.jumpProgress < 0.7) {
                    return;
                }

                const fRow = frog.row;
                const fx = frog.x + CELL_SIZE * 0.15;
                const fw = CELL_SIZE * 0.7;
                const fy = frog.y + CELL_SIZE * 0.15;
                const fh = CELL_SIZE * 0.7;
                const frogCenterX = frog.x + CELL_SIZE * 0.5;

                // === 頂部經典 5 個山洞判定 (Row 1) ===
                if (fRow === 1) {
                    let enteredSlot = null;
                    HOME_SLOTS.forEach((slot, index) => {
                        const slotX = slot.col * CELL_SIZE;
                        const slotW = CELL_SIZE * 1.25;
                        if (frogCenterX >= slotX - 10 && frogCenterX <= slotX + slotW + 10) {
                            enteredSlot = { slot, index, slotX, slotW };
                        }
                    });

                    if (enteredSlot) {
                        if (!enteredSlot.slot.filled) {
                            enteredSlot.slot.filled = true;
                            frog.x = enteredSlot.slotX + (enteredSlot.slotW - CELL_SIZE) / 2;
                            frog.targetX = frog.x;
                            frog.col = frog.x / CELL_SIZE;

                            let pts = 50 + Math.floor(this.timer) * 10;

                            if (enteredSlot.slot.hasFly) {
                                pts += 200;
                                sound.playBonus();
                                enteredSlot.slot.hasFly = false;
                            } else {
                                sound.playHome();
                            }

                            this.addScore(pts);

                            const allFilled = HOME_SLOTS.every(s => s.filled);
                            if (allFilled) {
                                this.onLevelClear();
                            } else {
                                this.resetRound();
                            }
                            return;
                        } else {
                            frog.die('squash');
                            return;
                        }
                    } else {
                        // 撞上山洞邊緣壁
                        frog.die('squash');
                        return;
                    }
                }

                // === 公路區 (Row 8 - 12) ===
                if (fRow >= 8 && fRow <= 12) {
                    for (const obs of this.laneManager.lanes) {
                        if (obs.row === fRow) {
                            if (fx < obs.x + obs.width &&
                                fx + fw > obs.x &&
                                fy < obs.y + obs.height &&
                                fy + fh > obs.y) {
                                frog.die('squash');
                                return;
                            }
                        }
                    }
                }

                // === 河流區 (Row 2 - 6) ===
                if (fRow >= 2 && fRow <= 6) {
                    let ridingObstacle = null;
                    const tolerance = 15; // 寬容度，確保不會踏偏落水

                    for (const obs of this.laneManager.lanes) {
                        if (obs.row === fRow) {
                            if (frogCenterX >= obs.x - tolerance && frogCenterX <= obs.x + obs.width + tolerance) {
                                ridingObstacle = obs;
                                break;
                            }
                        }
                    }

                    if (ridingObstacle) {
                        // 穩定隨浮木或海龜漂移，不下沉
                        const drift = ridingObstacle.speed * (1 + (this.level - 1) * 0.15) * deltaTime;
                        frog.x += drift;
                        frog.targetX += drift;
                        frog.col = frog.x / CELL_SIZE;

                        // 漂出螢幕邊界死亡
                        if (frog.x < -CELL_SIZE * 0.85 || frog.x > INTERNAL_WIDTH - CELL_SIZE * 0.15) {
                            frog.die('drown');
                            return;
                        }
                    } else {
                        // 真正落水溺斃
                        frog.die('drown');
                        return;
                    }
                }
            }

            onLevelClear() {
                this.state = 'LEVEL_CLEAR';
                this.addScore(1000);
                sound.playLevelClear();

                const overlay = document.getElementById('overlayScreen');
                const title = document.getElementById('overlayTitle');
                const msg = document.getElementById('overlayMessage');
                const btn = document.getElementById('primaryBtn');

                title.textContent = `LEVEL ${this.level} CLEAR!`;
                title.className = "text-2xl sm:text-3xl text-yellow-400 font-bold mb-2 tracking-widest flash";
                msg.textContent = `恭喜過關！獲得 1000 點獎勵！即將進入第 ${this.level + 1} 關！`;
                btn.textContent = "繼續下一關";
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
                overlay.classList.remove('hidden');

                setTimeout(() => {
                    this.level++;
                    this.resetHomeSlots();
                    this.resetRound();
                    this.state = 'PLAYING';
                    overlay.classList.add('hidden');
                    this.updateUI();
                }, 2200);
            }

            showGameOverScreen() {
                const overlay = document.getElementById('overlayScreen');
                const title = document.getElementById('overlayTitle');
                const msg = document.getElementById('overlayMessage');
                const btn = document.getElementById('primaryBtn');

                title.textContent = "GAME OVER";
                title.className = "text-3xl text-red-500 font-bold mb-2 tracking-widest";
                msg.textContent = `最終得分: ${this.score} 分！感謝遊玩！`;
                btn.textContent = "TRY AGAIN (再來一局)";
                overlay.classList.remove('hidden');
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
            }

            updateFlySpawner(deltaTime) {
                this.bonusFlyTimer += deltaTime;
                if (this.bonusFlyTimer > 8) {
                    this.bonusFlyTimer = 0;
                    HOME_SLOTS.forEach(s => s.hasFly = false);

                    const emptySlots = HOME_SLOTS.map((s, idx) => (!s.filled ? idx : -1)).filter(idx => idx !== -1);
                    if (emptySlots.length > 0 && Math.random() < 0.6) {
                        const randomIdx = emptySlots[Math.floor(Math.random() * emptySlots.length)];
                        HOME_SLOTS[randomIdx].hasFly = true;
                    }
                }
            }

            update(currentTime) {
                const deltaTime = Math.min((currentTime - this.lastFrameTime) / 1000, 0.1);
                this.lastFrameTime = currentTime;

                if (this.state === 'PLAYING') {
                    this.timer -= deltaTime;
                    if (this.timer <= 0) {
                        this.timer = 0;
                        this.frog.die('squash');
                    }
                    this.updateTimerBar();

                    const levelMultiplier = 1 + (this.level - 1) * 0.15;
                    this.laneManager.update(deltaTime, levelMultiplier);
                    this.frog.update(deltaTime);
                    this.checkCollisions(deltaTime);
                    this.updateFlySpawner(deltaTime);
                } else {
                    this.laneManager.update(deltaTime, 1);
                }

                this.renderer.drawBackground();
                this.renderer.drawObstacles(this.laneManager.lanes);
                this.renderer.drawFrog(this.frog);

                requestAnimationFrame((t) => this.update(t));
            }

            updateTimerBar() {
                const bar = document.getElementById('timeProgressBar');
                if (!bar) return;
                const percent = Math.max(0, Math.min(100, (this.timer / this.timeLimit) * 100));
                bar.style.width = `${percent}%`;
            }

            updateUI() {
                document.getElementById('scoreDisplay').textContent = String(this.score).padStart(5, '0');
                document.getElementById('highScoreDisplay').textContent = String(this.highScore).padStart(5, '0');
                document.getElementById('levelDisplay').textContent = this.level;

                const livesContainer = document.getElementById('livesContainer');
                livesContainer.innerHTML = '<span class="text-gray-400 text-[10px] mr-1">LIVES:</span>';
                for (let i = 0; i < this.lives; i++) {
                    const icon = document.createElement('i');
                    icon.className = 'fa-solid fa-frog text-green-400 text-sm';
                    livesContainer.appendChild(icon);
                }
            }
        }

        let game = null;

        function initApp() {
            if (game) return;
            game = new GameEngine();
            game.updateUI();
            requestAnimationFrame((t) => game.update(t));

            const primaryBtn = document.getElementById('primaryBtn');
            const overlay = document.getElementById('overlayScreen');

            const handleStart = (e) => {
                if (e) e.preventDefault();
                sound.init();
                overlay.classList.add('hidden');
                game.startNewGame();
            };

            primaryBtn.addEventListener('click', handleStart);
            primaryBtn.addEventListener('touchstart', handleStart, { passive: false });

            // 鍵盤移動操控
            window.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                    e.preventDefault();
                }

                if (game.state !== 'PLAYING') {
                    if (e.code === 'Space' || e.code === 'Enter') {
                        handleStart();
                    }
                    return;
                }

                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        game.frog.move(0, -1, 'UP');
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        game.frog.move(0, 1, 'DOWN');
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        game.frog.move(-1, 0, 'LEFT');
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        game.frog.move(1, 0, 'RIGHT');
                        break;
                }
            });

            // 虛擬 D-Pad 按鈕
            const bindBtn = (id, dCol, dRow, dir) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                const handlePress = (e) => {
                    e.preventDefault();
                    sound.init();
                    if (game.state === 'PLAYING') {
                        game.frog.move(dCol, dRow, dir);
                    }
                };
                btn.addEventListener('touchstart', handlePress, { passive: false });
                btn.addEventListener('mousedown', handlePress);
            };

            bindBtn('btnUp', 0, -1, 'UP');
            bindBtn('btnDown', 0, 1, 'DOWN');
            bindBtn('btnLeft', -1, 0, 'LEFT');
            bindBtn('btnRight', 1, 0, 'RIGHT');

            // 畫布滑動手勢
            let touchStartX = 0;
            let touchStartY = 0;
            const canvasElem = document.getElementById('gameCanvas');

            canvasElem.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }, { passive: true });

            canvasElem.addEventListener('touchend', (e) => {
                if (game.state !== 'PLAYING') return;
                const touch = e.changedTouches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                const absX = Math.abs(dx);
                const absY = Math.abs(dy);

                if (Math.max(absX, absY) > 25) {
                    if (absX > absY) {
                        if (dx > 0) game.frog.move(1, 0, 'RIGHT');
                        else game.frog.move(-1, 0, 'LEFT');
                    } else {
                        if (dy > 0) game.frog.move(0, 1, 'DOWN');
                        else game.frog.move(0, -1, 'UP');
                    }
                }
            }, { passive: true });

            // 音效開關切換
            const soundBtn = document.getElementById('soundToggleBtn');
            const soundIcon = document.getElementById('soundIcon');
            soundBtn.addEventListener('click', () => {
                sound.init();
                sound.enabled = !sound.enabled;
                if (sound.enabled) {
                    soundIcon.className = 'fa-solid fa-volume-high';
                    soundBtn.classList.replace('text-gray-500', 'text-yellow-400');
                } else {
                    soundIcon.className = 'fa-solid fa-volume-xmark';
                    soundBtn.classList.replace('text-yellow-400', 'text-gray-500');
                }
            });

            // CRT 濾鏡開關切換
            const crtBtn = document.getElementById('crtToggleBtn');
            const screenBox = document.getElementById('screenContainer');
            crtBtn.addEventListener('click', () => {
                screenBox.classList.toggle('crt');
                crtBtn.classList.toggle('text-green-400');
                crtBtn.classList.toggle('text-gray-500');
            });

            // 說明彈窗
            const helpBtn = document.getElementById('helpBtn');
            const helpModal = document.getElementById('helpModal');
            const closeHelpBtn = document.getElementById('closeHelpBtn');
            helpBtn.addEventListener('click', () => helpModal.classList.remove('hidden'));
            closeHelpBtn.addEventListener('click', () => helpModal.classList.add('hidden'));
        }

        window.addEventListener('DOMContentLoaded', initApp);
        window.addEventListener('load', initApp);
    </script>
</body>
</html>
